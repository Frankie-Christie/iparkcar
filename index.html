<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iParkCar</title>
    <link rel="icon" href="icons/ipark-logo2.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <script type="module" src="js/script.js" defer></script>
</head>
<body>
    <div id="map">
        <div class="map-overlay"> 
            <header>
                <h1>i<span style="color:black">Park</span>Car</h1>
            </header>
            
            <div class="topnav">
                <img id="btnMenu" class="nav-icon" src="icons/menu.png">
                <input type="text" id="search" placeholder="Your Destination..">
                <img id="btnFilter" class="nav-icon" src="icons/filter.png">
            </div>
        </div>
        <!-- panels can't be map-overlay class because they have to go under the nav. -->
        <div class="panel panel-top" id="filterPanel">
            <form>
                <label for="datetime">Adjust date/time for when you want to park, for more accurate suggestions</label><br>
                <input id="datetime" type="datetime-local"> 
                <fieldset>
                    <legend>Filter by type</legend>
                    <label><input type="checkbox" value="free"> Free</label><br>
                    <label><input type="checkbox" value="mobility"> Mobility</label><br>
                    <label><input type="checkbox" value="TCC-paid"> Public paid (TCC owned)</label><br>
                    <label><input type="checkbox" value="private-paid"> Private paid (scamalots)</label><br>
                    <label><input type="checkbox" value="private-paid-lease"> Private paid monthly lease (double scamalots)</label><br>
                </fieldset>
            </form>
        </div>
        <div class="panel panel-left" id="menuPanel">
            <ul class="menu">
                <li>Settings</li>
                <li>Tutorial</li>
                <li>Payment history</li>
                <li>Alerts</li>
                <li>Report a bug</li>
                <li>Acknowledgements</li>
                <li>Feedback</li>
            </ul>
        </div>
    </div>
</body>
</html>
